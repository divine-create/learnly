services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learnly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnly
      POSTGRES_PASSWORD: learnly
      POSTGRES_DB: learnly
    # Host port 5433 to avoid clashing with any other local Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - learnly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnly -d learnly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learnly-pgdata:
